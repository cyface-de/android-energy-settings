# This workflow configures CodeQL as the auto-configuration fails for Java/Kotlin.
#
# @author Armin Schnabel
# @version 1.0.0
# @since 4.3.0
name: "CodeQL Analysis"

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'
  schedule:
    - cron: '22 1 * * 3'

# Explicit workflow permissions (as little as required)
permissions:
  contents: read

# A new commit on a pull request stops the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04

    permissions:
      contents: read          # to check out the code
      security-events: write  # to upload the results

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual # autobuild fails (gradle.properties required)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Do not keep the token on the runner after the checkout, where build scripts and dependencies can read it
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # 'java-kotlin' to analyze code written in Java, Kotlin or both
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Add gradle.properties
        run: cp gradle.properties.template gradle.properties

      - name: Build with Gradle
        run: ./gradlew build
        env:
          # Gradle reads `ORG_GRADLE_PROJECT_<name>` as the project property `<name>`. The token is not written to a file.
          # A personal read token is used to install the Cyface Utils package.
          ORG_GRADLE_PROJECT_githubUser: ${{ secrets.GH_READ_ACCOUNT }}
          ORG_GRADLE_PROJECT_githubToken: ${{ secrets.GH_READ_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
