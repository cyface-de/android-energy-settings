# This workflow ensures the building step works
#
# @author Armin Schnabel
# @version 1.2.0
# @since 1.1.1
name: Gradle Build

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'

# Explicit workflow permissions (as little as required)
permissions:
  contents: read

# A new commit on a pull request stops the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Only for pushes (assumes protected branches) and for PRs from this repo (not from forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          # Do not keep the token on the runner after the checkout, where build scripts and dependencies can read it
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Add gradle.properties
        run: cp gradle.properties.template gradle.properties

      - name: Build with Gradle
        run: ./gradlew build
        env:
          # Gradle reads `ORG_GRADLE_PROJECT_<name>` as the project property `<name>`. The token is not written to a file.
          # A personal read token is used to install the Cyface Utils package.
          ORG_GRADLE_PROJECT_githubUser: ${{ secrets.GH_READ_ACCOUNT }}
          ORG_GRADLE_PROJECT_githubToken: ${{ secrets.GH_READ_TOKEN }}
